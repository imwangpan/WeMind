name: Website

on:
  push:
    branches: ["main"]
    paths:
      - "apps/website/**"
      - ".github/workflows/website.yml"
  pull_request:
    paths:
      - "apps/website/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.11"
          cache: "npm"
          cache-dependency-path: apps/website/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Build for GitHub Pages
        env:
          DOCS_BASE: /WeMind/
          DOCS_CLEAN_URLS: "false"
        run: npm run build
      - run: touch docs/.vitepress/dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: apps/website/docs/.vitepress/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
