name: CI

on:
  push:
    branches: ["main", "feat/**", "fix/**"]
  pull_request:

# 同一分支连推两次时，旧的那次已经没意义了：直接取消，省掉一台 runner 的排队与电费。
# main 上不取消——它是发布前必须跑完的那次。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # 最低运行版本：发布包声明 Node >=24.11，这里用它真跑一遍测试与构建，避免「声明的最低版本从未验证」。
  # tsdown 的 engines 是 ^22.18.0 || >=24.11.0，24.11 恰好也是从源码构建的下限。
  min-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.11"
          cache: "npm"
      - run: npm ci
      # core 是 JIT 源码包，不再需要预构建；本 job 直接跑测试，锁住「无 core dist 也能跑」这个不变量。
      - run: npm test
      - run: npm run build
      - run: test ! -e packages/wechat-ilink-core/dist

  build-test:
    strategy:
      fail-fast: false
      matrix:
        # Windows 是主要运行平台（进程身份/spawn/.cmd/junction/停止链都是平台相关），
        # 只在 Linux 跑会让这些路径的回归漏到用户机器上。
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # doc-impact 需要 merge-base（origin/main），浅克隆拿不到。
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - name: Check agent docs
        run: node scripts/check-agent-docs.mjs
      - name: Check generated doc tables
        run: node scripts/gen-docs-tables.mjs --check

      - name: 面向用户的文案
        run: node scripts/check-user-copy.mjs
      - name: Check docs impact
        env:
          DOCS_IMPACT_MESSAGE: ${{ github.event.pull_request.body }}
        run: node scripts/doc-impact.mjs --check --base "origin/${{ github.base_ref || 'main' }}"
      - name: Check docs links
        shell: pwsh
        run: node scripts/check-docs.mjs
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check:version
      - run: npm pack --dry-run -w @wemind/cli -w @wemind/wechat-mcp
      - run: npm test
