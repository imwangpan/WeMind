name: CI

on:
  push:
    branches: ["main", "feat/**", "fix/**"]
  pull_request:

jobs:
  # 最低运行版本：只验证运行时（不跑 tsdown——它的 engines 要求 Node >=22.18，属于开发工具链）。
  # 发布包声明 Node >=20.19；这里用 Node 20 的最新小版本真跑一遍测试，避免「声明的最低版本从未验证」。
  min-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run build -w @wemind/wechat-ilink-core
      - run: npm test

  build-test:
    strategy:
      fail-fast: false
      matrix:
        # Windows 是主要运行平台（进程身份/spawn/.cmd/junction/停止链都是平台相关），
        # 只在 Linux 跑会让这些路径的回归漏到用户机器上。
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - name: Check docs links
        shell: pwsh
        run: ./scripts/check-docs.ps1
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
